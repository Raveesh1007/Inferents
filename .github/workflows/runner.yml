name: Build runner

# Builds the Linux runner on Ubuntu 24.04 and publishes it as the `runner-latest` release, so a small server can
# download the finished program instead of compiling Rust itself.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/runner.yml"
      - "runner/**"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p inferents-runner --bin inferents-runner
      - run: |
          cp target/release/inferents-runner inferents-runner-linux-x86_64
          gh release delete runner-latest --yes --cleanup-tag || true
          gh release create runner-latest inferents-runner-linux-x86_64 --title "Runner (latest build)" --notes "Linux x86_64 build of the runner."
        env:
          GH_TOKEN: ${{ github.token }}

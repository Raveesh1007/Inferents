[package]
name = "inferents-contract"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.30", features = ["unstable"] }
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unstable", "unit-testing"] }
alloy-dyn-abi = { version = "1.6", features = ["eip712"] }
serde_json = "1"
